name: Pages

# Baut bei jedem Push auf main und veroeffentlicht das Ergebnis auf GitHub Pages.
#
# Warum die Veroeffentlichung in diesem Workflow steckt und nicht ueber einen
# gh-pages-Branch laeuft: Beim Weg ueber den Branch startet GitHub einen eigenen
# Workflow `pages build and deployment`, den wir nicht kontrollieren. Am
# 06.08.2026 blieb dessen build-Job wiederholt viertelstundenlang mit leerem
# runner_name in der Warteschlange, waehrend dieser Workflow im selben Zeitraum
# in unter einer Minute durchlief. Alles in einem Workflow heisst: eine
# Warteschlange, die nachweislich bedient wird.
#
# Voraussetzung, die von Hand zu setzen ist: Settings -> Pages -> Source auf
# "GitHub Actions". `actions/configure-pages` nimmt das NICHT ab — steht die
# Quelle noch auf einem Branch, laeuft der Schritt wortlos durch und der Job
# `veroeffentlichen` scheitert danach in zwei Sekunden, ohne Runner und ohne Log.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Eigener Gruppenname statt "pages": Nebenlaeufigkeitsgruppen gelten
# repository-weit, nicht pro Workflow.
concurrency:
  group: seite-veroeffentlichen
  # Eine laufende Veroeffentlichung nicht abbrechen — ein halb ausgelieferter
  # Stand waere schlimmer als ein ueberholter.
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Nicht veröffentlichen, was nicht durchläuft: erst prüfen, dann bauen.
      - name: Typprüfung
        run: npm run lint

      - name: Tests
        run: npm test

      # Legt eine noch nicht eingerichtete Pages-Seite an. Eine BESTEHENDE Seite
      # stellt der Schritt nicht von Branch auf Actions um — das ist am
      # 06.08.2026 nachgewiesen worden. Er bleibt trotzdem drin, weil er auf
      # einem frischen Repository die Einrichtung spart.
      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Project Pages liegen unter /<repo>/, deshalb der Basispfad.
      - name: Build
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  veroeffentlichen:
    needs: bauen
    # Die Umgebung `github-pages` laesst nur Veroeffentlichungen vom
    # Standardbranch zu. Ein Lauf auf einem Feature-Branch soll deshalb bauen
    # und pruefen, aber nicht ausliefern — sonst scheitert er sekundenschnell an
    # der Schutzregel, ohne je einen Runner zu bekommen, und faerbt den Pull
    # Request rot, obwohl nichts kaputt ist.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
