name: Pages

# Baut bei jedem Push auf main und legt das Ergebnis im Branch `gh-pages` ab.
#
# Warum über einen Branch und nicht über actions/deploy-pages: Die Seite wird
# dann von GitHub direkt aus dem Branch ausgeliefert und bleibt auch dann
# erreichbar, wenn gerade kein Actions-Runner verfügbar ist. Der Branch lässt
# sich zur Not von Hand befüllen — `npm run build -- --base=/<repo>/`, Inhalt
# von `dist/` samt `.nojekyll` in den Branch, fertig.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Nicht veröffentlichen, was nicht durchläuft: erst prüfen, dann bauen.
      - name: Typprüfung
        run: npm run lint

      - name: Tests
        run: npm test

      # Project Pages liegen unter /<repo>/, deshalb der Basispfad.
      - name: Build
        run: |
          npm run build -- --base=/${{ github.event.repository.name }}/
          touch dist/.nojekyll

      - name: Nach gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: Claude
          user_email: noreply@anthropic.com
          commit_message: "Gebaute Seite fuer GitHub Pages (${{ github.sha }})"
