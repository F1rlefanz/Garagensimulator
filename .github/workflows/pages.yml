name: Pages

# Baut bei jedem Push auf main und legt das Ergebnis im Branch `gh-pages` ab.
#
# Warum über einen Branch und nicht über actions/deploy-pages: Der gebaute Stand
# liegt als fertiges Artefakt im Branch und laesst sich zur Not von Hand
# befuellen — `npm run build -- --base=/<repo>/`, Inhalt von `dist/` samt
# `.nojekyll` in den Branch, fertig.
#
# Achtung: Das macht die Veroeffentlichung NICHT unabhaengig von Actions-Runnern.
# GitHub startet fuer den Branch einen eigenen Workflow
# `pages build and deployment`, den wir nicht kontrollieren, und der braucht
# ebenfalls einen Runner. Details in docs/05-architektur.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Eigener Gruppenname: Nebenlaeufigkeitsgruppen gelten repository-weit, nicht
# pro Workflow. Hiesse die Gruppe "pages", koennte dieser Workflow GitHubs
# eigene Auslieferung abbrechen, die denselben Namen verwendet.
concurrency:
  group: seite-bauen
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Nicht veröffentlichen, was nicht durchläuft: erst prüfen, dann bauen.
      - name: Typprüfung
        run: npm run lint

      - name: Tests
        run: npm test

      # Project Pages liegen unter /<repo>/, deshalb der Basispfad.
      - name: Build
        run: |
          npm run build -- --base=/${{ github.event.repository.name }}/
          touch dist/.nojekyll

      - name: Nach gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: Claude
          user_email: noreply@anthropic.com
          commit_message: "Gebaute Seite fuer GitHub Pages (${{ github.sha }})"
